<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lounge{x} · 2026 경영관리 대시보드</title>
<style>
:root{
  --ink:#14161a; --ink2:#3d434d; --mut:#767d89; --line:#e4e7ec; --line2:#eef1f4;
  --bg:#fbfcfd; --card:#ffffff; --brand:#0f5c4d; --brand2:#16887280; --accent:#e07a3f;
  --pos:#1f9d6b; --neg:#d64545; --warn:#e0a13f; --chip:#f2f5f7;
  --shadow:0 1px 2px rgba(20,22,26,.04),0 2px 8px rgba(20,22,26,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
a{color:inherit}
/* header */
header{background:var(--brand);color:#fff;padding:22px 0 0}
.brandrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.logo{font-size:23px;font-weight:800;letter-spacing:-.02em}
.logo span{color:#8fd9c8}
.hsub{font-size:13px;color:#bfe5dc;font-weight:500}
.asof{margin-left:auto;font-size:12px;color:#9fd3c7}
.tabs{display:flex;gap:2px;margin-top:18px;flex-wrap:wrap}
.tab{padding:10px 15px;font-size:13.5px;font-weight:600;color:#bfe5dc;cursor:pointer;
  border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;white-space:nowrap;transition:.12s}
.tab:hover{color:#fff;background:#ffffff18}
.tab.on{background:var(--bg);color:var(--brand);border-color:var(--line)}
.tab b{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;border-radius:5px;
  background:#ffffff2a;font-size:11px;margin-right:6px;font-weight:700}
.tab.on b{background:var(--brand);color:#fff}
/* sections */
main{padding:26px 0 70px}
.panel{display:none;animation:fade .2s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2.sec{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mut);
  text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:9px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
h3{font-size:16px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
.lead{font-size:13.5px;color:var(--ink2);line-height:1.6;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
/* mission */
.mv{background:linear-gradient(135deg,#0f5c4d,#0b4a3e);color:#fff;border:none;padding:26px 28px}
.mv .lbl{font-size:11px;letter-spacing:.08em;color:#8fd9c8;font-weight:700;margin-bottom:7px}
.mv .txt{font-size:18px;line-height:1.5;font-weight:600;letter-spacing:-.01em;max-width:64ch}
.mv+.mv{margin-top:0}
/* KPI cards */
.kpi{position:relative}
.kpi .t{font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.kpi .u{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px}
.kpi .d{font-size:12px;margin-top:7px;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.pill.pos{background:#e5f6ee;color:#0d7a4f}.pill.neg{background:#fae7e7;color:#b83232}
.pill.warn{background:#fbf1dd;color:#a9761c}
.barwrap{margin-top:9px;height:6px;background:var(--line2);border-radius:4px;overflow:hidden}
.barfill{height:100%;border-radius:4px}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line2)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  border-bottom:1.5px solid var(--line);position:sticky;top:0;background:var(--card)}
tbody tr:hover{background:var(--chip)}
td.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:700;background:var(--chip);color:var(--ink2)}
/* chart */
.chart{width:100%;height:auto;overflow:visible}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--mut);line-height:1.55;margin-top:6px}
/* callout */
.call{border-left:3px solid var(--accent);background:#fdf6f1;padding:13px 16px;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.6;color:#7a4a2c}
.call.crit{border-color:var(--neg);background:#fdf1f1;color:#8f2f2f}
.call b{color:inherit}
/* task */
.task{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.task .hd{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.task .id{font-size:11px;font-weight:800;color:var(--brand);background:#e6f2ee;padding:2px 7px;border-radius:5px}
.task .nm{font-size:14px;font-weight:700;letter-spacing:-.01em}
.task .meta{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.foc{font-size:10.5px;font-weight:800;color:#fff;background:var(--accent);padding:2px 7px;border-radius:5px}
.step{display:flex;gap:11px;align-items:flex-start;font-size:13.5px;line-height:1.55;color:var(--ink2);margin-bottom:11px}
.step .n{flex:0 0 24px;height:24px;border-radius:7px;background:var(--brand);color:#fff;font-weight:800;
  font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step b{color:var(--ink)}
.hint{font-size:12.5px;color:var(--mut);margin-top:14px;padding-top:13px;border-top:1px dashed var(--line)}

.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s;background:var(--card)}
.opt:hover{border-color:var(--accent);background:#fdf7f3}
.opt.sel{border-color:var(--accent);background:#fdf0e8;box-shadow:0 0 0 1px var(--accent) inset}
.opt .chk{font-size:16px;color:var(--accent);flex:0 0 18px;line-height:1.3}
.p1card:hover{box-shadow:0 3px 14px rgba(224,122,63,.18)}
</style>

/* ---------- generic line chart (SVG) ---------- */
function lineChart(series,opts={}){
  const W=opts.w||620,H=opts.h||230,pl=46,pr=14,pt=16,pb=28;
  const iw=W-pl-pr, ih=H-pt-pb;
  let all=[];series.forEach(s=>s.data.forEach(v=>{if(v!=null)all.push(v)}));
  if(opts.zero)all.push(0);
  let mn=Math.min(...all),mx=Math.max(...all);
  if(mn>0)mn=0; const pad=(mx-mn)*0.08||1; mx+=pad; mn-=pad;
  const x=i=>pl+iw*i/(M.length-1);
  const y=v=>pt+ih*(1-(v-mn)/(mx-mn));
  let g='';
  // zero line
  if(mn<0&&mx>0){const zy=y(0);g+=`<line x1="${pl}" y1="${zy}" x2="${W-pr}" y2="${zy}" stroke="#c9ced6" stroke-width="1" stroke-dasharray="3 3"/>`}
  // gridlines + y labels
  for(let t=0;t<=4;t++){const val=mn+(mx-mn)*t/4;const yy=y(val);
    g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#eef1f4" stroke-width="1"/>`;
    g+=`<text x="${pl-8}" y="${yy+3}" text-anchor="end" font-size="10" fill="#98a0ac">${opts.yfmt?opts.yfmt(val):won(val,1)}</text>`}
  // x labels
  M.forEach((m,i)=>{g+=`<text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="#767d89">${m}</text>`});
  // series
  series.forEach(s=>{
    let path='',dots='';
    s.data.forEach((v,i)=>{if(v==null)return;const px=x(i),py=y(v);path+=(path?'L':'M')+px+' '+py+' ';
      dots+=`<circle cx="${px}" cy="${py}" r="3" fill="${s.c}"/>`});
    if(s.fill){const last=s.data.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
      if(last.length){const a=`M${last[0][0]} ${y(Math.max(0,mn))} `+last.map(p=>`L${p[0]} ${p[1]} `).join('')+`L${last[last.length-1][0]} ${y(Math.max(0,mn))} Z`;
      g+=`<path d="${a}" fill="${s.c}" opacity=".07"/>`}}
    g+=`<path d="${path}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

  const zy=y(0);g+=`<line x1="${pl}" y1="${zy}" x2="${W-pr}" y2="${zy}" stroke="#c9ced6"/>`;
  cats.forEach((c,i)=>{const cx=pl+gw*i+gw/2;
    series.forEach((s,j)=>{const v=s.data[i]||0;const bx=cx-(series.length*bw)/2+j*bw;const by=y(Math.max(0,v)),bh=Math.abs(y(v)-zy);
      g+=`<rect x="${bx}" y="${by}" width="${bw-3}" height="${bh}" rx="2" fill="${s.c}"/>`});
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="#767d89">${c}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>`;
}

/* ---- 제1과제 진단 모듈 ---- */
function openDiag(){
  const box=document.getElementById('diagBox');
  if(box.innerHTML){box.innerHTML='';return;}
  const dg=D.diag.slice().sort((a,b)=>b.avg-a.avg);
  const own=D.diag.filter(d=>d.model==='무인직영');
  const ownAvg=own.reduce((s,d)=>s+d.avg,0)/own.length;
  const hi=dg[0], lo=dg[dg.length-1];
  const ratio=(hi.avg/lo.avg).toFixed(1);
  const mannedM=Math.round(D.mannedAvg/1e4);
  let h=`<div class="card" style="margin-top:14px;border-color:var(--accent)">
   <h3>실데이터 진단 · 무인 점포당 매출은 왜 낮은가</h3>
   <p class="note">1~8월 활동월 평균매출 기준. 무인직영 3개 + 투자모델 6개 전부를 입지와 함께 진단.</p>`;
  // 1) 점포별 매출 랭킹 바
  h+=`<div style="margin:16px 0">`;
  const mx=Math.max(...dg.map(d=>d.avg));
  dg.forEach(d=>{const w=(d.avg/mx*100).toFixed(0);
    const footColor=d.foot.includes('높음')?'#1f9d6b':(d.foot.includes('낮음')||d.foot.includes('주중'))?'#d64545':'#e0a13f';
    h+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px">
      <div style="width:78px;text-align:right;font-weight:700">${d.name}</div>
      <div style="width:52px;font-size:11px;color:var(--mut)">${d.model==='무인직영'?'직영':'투자'}</div>
      <div style="flex:1;background:var(--line2);border-radius:5px;height:22px;position:relative">
        <div style="width:${w}%;height:100%;background:${footColor};border-radius:5px"></div>
        <span style="position:absolute;right:8px;top:2px;font-size:11.5px;font-weight:700;color:#fff;mix-blend-mode:difference">${Math.round(d.avg/1e4).toLocaleString()}만</span>
      </div>
      <div style="width:96px;font-size:11px;color:var(--mut)">${d.foot}</div></div>`});
  h+=`</div>`;
  h+=`<div class="lgd"><span><i style="background:#1f9d6b"></i>유동인구 높음</span><span><i style="background:#e0a13f"></i>중간</span><span><i style="background:#d64545"></i>낮음/주중한정</span></div>`;
  // 2) 판정
  h+=`<div style="margin-top:20px" class="grid g3">
    <div class="card kpi"><div class="t">무인 최고 vs 최저</div><div class="v">${ratio}배</div><div class="d">${hi.name}(${Math.round(hi.avg/1e4)}만) vs ${lo.name}(${Math.round(lo.avg/1e4)}만)</div></div>
    <div class="card kpi"><div class="t">무인직영 평균</div><div class="v">${Math.round(ownAvg/1e4)}만<span class="u">/점</span></div><div class="d neg">유인 ${mannedM.toLocaleString()}만의 ${(ownAvg/D.mannedAvg*100).toFixed(0)}% 수준</div></div>
    <div class="card kpi"><div class="t">가맹점주 월이익(추정)</div><div class="v neg">~300만</div><div class="d neg">이 매출론 점주 설득 불가</div></div>
  </div>`;
  // 3) 세 가설 판정
  h+=`<h3 style="margin-top:22px">세 가설 중 무엇인가</h3>
  <table style="margin-top:8px"><thead><tr><th>가설</th><th>검증 결과</th><th>판정</th></tr></thead><tbody>
  <tr><td style="max-width:26ch"><b>① 입지 차등</b><br><span style="color:var(--mut);font-size:12px">자리에 따라 매출이 갈린다</span></td>
    <td style="text-align:left">유동인구 높은 성수·을지·강남 1,400~2,300만 vs 낮은 서울숲·원그로브 640~710만. <b>${ratio}배 격차가 입지와 정확히 일치.</b></td>
    <td><span class="pill neg">지배적 요인</span></td></tr>
  <tr><td style="max-width:26ch"><b>② 구조적 천장</b><br><span style="color:var(--mut);font-size:12px">무인 포맷의 한계</span></td>
    <td style="text-align:left">만약 구조적 천장이면 좋은 입지도 낮아야 함. 그러나 강남·을지는 2,000만 안팎 달성. <b>천장은 포맷이 아니라 나쁜 입지에만 존재.</b></td>
    <td><span class="pill warn">부분 기각</span></td></tr>
  <tr><td style="max-width:26ch"><b>③ 미실행 개선책</b><br><span style="color:var(--mut);font-size:12px">아직 안 해본 게 있다</span></td>
    <td style="text-align:left">동일점 증감률(SSS-U) 전월 마이너스 지속 = 기존점 자연성장은 정체. 운영개선 여지는 있으나 입지 격차를 뒤집을 규모는 아님.</td>
    <td><span class="pill warn">보조적</span></td></tr>
  </tbody></table>`;
  // 4) 결론
  h+=`<div class="call crit" style="margin-top:16px"><b>진단 결론</b> — 무인 점포당 매출 부진의 <b>지배적 원인은 입지 차등</b>이다. 무인 포맷 자체의 구조적 천장은 근거가 약하다(좋은 입지에선 2,000만 이상 나옴). 따라서 개선 전략의 축은 <b>①나쁜 입지 점포의 처리 ②출점 기준의 전환 ③가맹 프로토타입을 고매출 입지/포맷으로 재정의</b> 세 가지다. 운영개선(③)은 보조 레버로 병행한다.</div>`;
  // 5) 개선책 선택
  h+=`<h3 style="margin-top:22px">택할 수 있는 개선책 — 선택하세요</h3>
  <p class="note">각 개선책을 클릭하면 선택됨(경영진 의사결정 기록용). 여러 개 선택 가능.</p>
  <div id="optList" style="margin-top:12px">`;
  const opts=[
   {id:'O1',t:'저매출 점포 정리 (서울숲·원그로브)',d:'월 640~710만 점포는 가맹 프로토타입으로 부적합. 철수 또는 재입지. 손실 즉시 차단.',tag:'구조'},
   {id:'O2',t:'출점 기준을 "유동인구 상위 입지"로 고정',d:'성수·을지·강남 수준의 입지에만 출점. 향후 가맹 모집 시 이 입지 데이터를 셀링포인트로.',tag:'구조'},
   {id:'O3',t:'가맹 프로토타입을 고매출 입지로 재정의',d:'강남·을지(2,000만+) 1~2개를 "가맹 표준모델"로 지정, 점주 수익 시뮬을 이 매출로 작성.',tag:'전략'},
   {id:'O4',t:'유인/하이브리드 가맹 옵션 검토',d:'유인 점포당 매출은 무인의 4배(3,881만). 로봇 부분도입 하이브리드로 점주 이익 극대화 검토.',tag:'전략'},
   {id:'O5',t:'무인 운영개선 실험 (객단가·시간대)',d:'푸드 동반구매·피크시간 프로모션으로 기존점 매출 +10~15% 시도. 입지 한계 내 최대화.',tag:'운영'},
   {id:'O6',t:'실판매가능시간 개선 (품절·결제오류)',d:'로봇 가동률·품절·결제실패로 인한 매출누수 측정 후 제거. 무인 고유 레버.',tag:'운영'},
  ];
  opts.forEach(o=>{h+=`<div class="opt" data-id="${o.id}" onclick="pickOpt('${o.id}')">
    <div class="chk">○</div>
    <div style="flex:1"><div style="font-weight:700;font-size:14px">${o.t} <span class="tag" style="margin-left:6px">${o.tag}</span></div>
    <div style="font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.5">${o.d}</div></div></div>`});
  h+=`</div>
  <div id="pickSummary" class="hint">선택한 개선책이 여기 요약됩니다 → 다음 임원미팅 안건으로 확정.</div>`;
  h+=`</div>`;
  box.innerHTML=h;
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
const picked=new Set();
function pickOpt(id){
  const el=document.querySelector(`.opt[data-id="${id}"]`);
  if(picked.has(id)){picked.delete(id);el.classList.remove('sel');el.querySelector('.chk').textContent='○';}
  else{picked.add(id);el.classList.add('sel');el.querySelector('.chk').textContent='●';}
  const names={O1:'저매출 점포 정리',O2:'출점 기준 전환',O3:'가맹 프로토타입 재정의',O4:'유인/하이브리드 가맹',O5:'무인 운영개선',O6:'실판매가능시간 개선'};
  const s=document.getElementById('pickSummary');
  if(picked.size===0){s.innerHTML='선택한 개선책이 여기 요약됩니다 → 다음 임원미팅 안건으로 확정.';s.style.color='';}
  else{s.innerHTML='<b>선택된 개선책('+picked.size+'):</b> '+[...picked].map(i=>names[i]).join(' · ')+' <br>→ 이 조합을 다음 임원미팅에서 담당·기한 배정.';s.style.color='var(--ink)';}
}

function taskCard(t,foc){
  const kpiMap={'게이트':'가맹 게이트','OP-U-OWN':'무인직영 손익','OP-U-INV':'투자모델 손익','OP-R':'로스터리 손익','SSS-M':'유인 동일점','DEL-G':'배송효율','EBI-C':'전사 EBITDA'};
  return `<div class="task"><div class="hd"><span class="id">${t.id}</span>
    ${foc?'<span class="foc">집중</span>':''}
    <span class="tag">${t.strat}</span></div>
    <div class="nm">${t.name}</div>
    <div class="meta"><span>핵심KPI · <b style="color:var(--ink2)">${kpiMap[t.kpi]||t.kpi}</b></span>
    <span>우선순위 P${t.prio}</span><span>상태 · ${t.status}</span></div></div>`;
}

/* ============ PANEL 4 : 지표 리뷰 ============ */
function panel4(){
  let h=`<h2 class="sec">05 · 지표 리뷰 루프</h2>
  <div class="card" style="margin-bottom:20px"><h3>경영관리 루프 — 이 대시보드의 사용법</h3>
  <div class="step" style="margin-top:14px"><div class="n">1</div><div><b>목표 확인</b> (탭 01) — 우리가 어디로 가기로 했나. 80억 / EBITDA 20억.</div></div>
  <div class="step"><div class="n">2</div><div><b>현재 스코어 인식</b> (탭 02·03) — 지금 몇 점인가. 매출 달성 42%, 적자 -20억.</div></div>
  <div class="step"><div class="n">3</div><div><b>문제 공유</b> (탭 03) — 무엇이 가장 문제인가. 가맹 미개시(갭의 86%).</div></div>
  <div class="step"><div class="n">4</div><div><b>과제 실행</b> (탭 04) — 문제를 푸는 과제에 자원을 몬다.</div></div>
  <div class="step"><div class="n">5</div><div><b>지표 리뷰</b> (이 탭) — 과제 실행 후 KPI가 움직였는지 확인 → 다음 과제로.</div></div>
  </div>`;
  h+=`<h2 class="sec">월간 리뷰 · 핵심지표 추적표</h2>
  <div class="card"><table><thead><tr><th>지표</th>${M.map(m=>`<th>${m}</th>`).join('')}<th>추세</th></tr></thead><tbody>`;
  const rows=[
    {n:'전사 매출',k:'REV-C',f:v=>won(v,1)},
    {n:'전사 영업손익',k:'OP-C',f:v=>won(v,1)},
    {n:'전사 EBITDA',k:'EBI-C',f:v=>won(v,1)},
    {n:'유인직영 손익',k:'OP-M',f:v=>wonM(v)},
    {n:'무인계 손익',k:'OP-U',f:v=>wonM(v)},
    {n:'유통 손익',k:'OP-F',f:v=>wonM(v)},
    {n:'무인 점포수',k:'CNT-U',f:num},
  ];
  rows.forEach(r=>{const a=K[r.k]||[];h+=`<tr><td>${r.n}</td>`+
    a.map(v=>`<td class="mono ${v!=null&&v<0?'neg':''}">${r.f(v)}</td>`).join('')+
    `<td>${spark(a)}</td></tr>`});
  h+=`</tbody></table>
  <p class="hint">※ 매월 마감 후 이 표를 갱신하면, 전략과제가 실제로 지표를 움직였는지 한눈에 보인다. 다음 리뷰에서 개선 없는 과제는 방식을 바꾸거나 폐기한다.</p></div>`;
  return h;
}
function spark(a){const v=a.filter(x=>x!=null);if(v.length<2)return'';const W=64,H=18;
  let mn=Math.min(...v),mx=Math.max(...v);if(mn===mx){mn-=1;mx+=1}
  const pts=a.map((x,i)=>x==null?null:`${(i/(a.length-1)*W).toFixed(1)},${(H-(x-mn)/(mx-mn)*H).toFixed(1)}`).filter(Boolean).join(' ');
  const up=v[v.length-1]>=v[0];
  return `<svg width="${W}" height="${H}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${up?'#1f9d6b':'#d64545'}" stroke-width="1.5"/></svg>`}

/* ---------- init ---------- */
const TABS=[['목표수립',panel0],['CSF · KPI',panel1],['현황 · 분석',panel2],['전략과제',panel3],['지표리뷰',panel4]];
const tabsEl=document.getElementById('tabs');
TABS.forEach((t,i)=>{const b=document.createElement('div');b.className='tab'+(i===0?' on':'');
  b.innerHTML=`<b>${i+1}</b>${t[0]}`;b.onclick=()=>show(i);tabsEl.appendChild(b)});
function show(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',i===j));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('on',i===j));window.scrollTo({top:0,behavior:'smooth'})}
TABS.forEach((t,i)=>{document.getElementById('p'+i).innerHTML=t[1]()});
document.getElementById('p0').classList.add('on');
</script>
